<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    table {
      width: 60%;
      margin: 20px auto;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    .present {
      color: green;
      font-weight: bold;
    }
    .absent {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>ABC Engineering College</h1>

  <table>
    <thead>
      <tr>
        <th>Roll Number</th>
        <th>Student Name</th>
        <th>Attendance Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>2403A51331</td>
        <td>P.Navya</td>
        <td class="present">Present</td>
      </tr>
      <tr>
        <td>2403A51332</td>
        <td>Zoya</td>
        <td class="absent">Absent</td>
      </tr>
      <tr>
        <td>2403A51334</td>
        <td>sathvika</td>
        <td class="present">Present</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
